<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Yaku | Capacítate</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
    <style>
        .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 24px; color: var(--primary); }
        .page-header h1 { font-size: 20px; font-weight: 800; color: var(--text-dark); margin: 0; }
        .page-header a { color: var(--primary); font-size: 20px; text-decoration: none; }
        
        .course-card { background: white; border: 1px solid var(--border-light); border-radius: 20px; padding: 20px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
        .course-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .c-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        .c-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; }
        .course-title { font-size: 16px; font-weight: 800; color: var(--text-dark); line-height: 1.3; }
        .course-desc { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .btn-course { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; display: block; margin-top: 5px;}
    </style>
</head>
<body>
<div class="app-container">
    <div class="view-container">
        <div class="page-header">
            <a href="index.html"><i class="fas fa-chevron-left"></i></a>
            <h1>Cursos disponibles</h1>
        </div>

        <div class="course-card">
            <div class="course-header">
                <div class="c-icon" style="background: var(--c-blue); color: #1E3A8A;"><i class="fas fa-wallet"></i></div>
                <div class="c-tag" style="background: #F0F0F5; color: var(--text-muted);">Módulo 1</div>
            </div>
            <div class="course-title">Educación financiera básica</div>
            <div class="course-desc">Aprende a separar tus finanzas personales de las del negocio.</div>
            <a href="#" class="btn-course">Empezar curso</a>
        </div>

        <div class="course-card">
            <div class="course-header">
                <div class="c-icon" style="background: var(--c-orange); color: #D97706;"><i class="fas fa-users"></i></div>
                <div class="c-tag" style="background: #F0F0F5; color: var(--text-muted);">Módulo 2</div>
            </div>
            <div class="course-title">Ventas y atención al cliente</div>
            <div class="course-desc">Técnicas efectivas para fidelizar a tus compradores.</div>
            <a href="#" class="btn-course">Ver lecciones</a>
        </div>
    </div>
</div>
</body>
</html>
