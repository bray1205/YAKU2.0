<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Yaku | Mi Progreso</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
    <style>
        body { background: #F8F9FE; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .btn-back { width: 36px; height: 36px; color: var(--primary); display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 20px; font-weight: 900;}
        .header h1 { font-size: 18px; font-weight: 900; color: var(--text-dark); margin: 0; }
        
        .tabs-container { display: flex; background: #F3F4F6; padding: 5px; border-radius: 20px; margin-bottom: 20px; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; border-radius: 16px; font-weight: 800; font-size: 13px; color: var(--text-muted); cursor: pointer; transition: 0.3s; border: none; background: transparent; }
        .tab-btn.active { background: #5B4DC8; color: white; box-shadow: 0 4px 10px rgba(91, 77, 200, 0.2); }

        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        
        .status-badge { display: inline-flex; align-items: center; gap: 4px; background: #DDF3D6; color: #065F46; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; }
        .progress-section { display: flex; align-items: center; gap: 20px; margin-top: 15px; }
        .progress-circle { width: 90px; height: 90px; border-radius: 50%; background: conic-gradient(#5B4DC8 0%, #F3F4F6 0%); display: flex; justify-content: center; align-items: center; position: relative;}
        .progress-inner { width: 74px; height: 74px; background: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .progress-val { font-size: 22px; font-weight: 900; color: #5B4DC8; line-height: 1; }
        .progress-lbl { font-size: 9px; font-weight: 800; color: var(--text-muted); }
        
        .edit-meta-btn { font-size: 14px; color: #8B5CF6; cursor: pointer; padding: 4px; margin-left: 5px; opacity: 0.8; transition: 0.2s; }
        .edit-meta-btn:active { transform: scale(0.9); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h3 { font-size: 15px; font-weight: 800; color: var(--text-dark); }
        .section-header a { font-size: 12px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .achievements-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .achievement-card { border: 1px solid #F3F4F6; border-radius: 16px; padding: 15px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ach-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .ach-title { font-size: 11px; font-weight: 800; color: var(--text-dark); line-height: 1.2; }

        .chart-container { height: 120px; display: flex; align-items: flex-end; justify-content: space-between; padding-top: 20px; border-bottom: 1px solid #F3F4F6; margin-bottom: 10px;}
        .chart-bar-group { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
        .bar-bg { width: 24px; background: #E5E7EB; border-radius: 6px 6px 0 0; display: flex; align-items: flex-end; justify-content: center; position: relative;}
        .bar-fill { width: 100%; background: #C4B5FD; border-radius: 6px 6px 0 0; transition: height 0.4s ease; }
        .bar-fill.active { background: #5B4DC8; }
        .bar-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .bar-val { position: absolute; top: -20px; font-size: 11px; font-weight: 900; color: #5B4DC8; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="view-container">
        
        <div class="header">
            <a href="index.html" class="btn-back"><i class="fas fa-chevron-left"></i></a>
            <h1>Mi progreso</h1>
            <div style="width: 36px;"></div>
        </div>

        <div class="tabs-container">
            <button class="tab-btn">Aprendizaje</button>
            <button class="tab-btn active">Negocio</button>
        </div>

        <!-- Meta Interactiva -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="status-badge"><i class="fas fa-leaf"></i> ¡En excelente camino!</div>
                <span id="lbl-mes-meta" style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: capitalize;">Meta</span>
            </div>
            
            <div class="progress-section">
                <div class="progress-circle" id="donut-meta">
                    <div class="progress-inner">
                        <span class="progress-val" id="lbl-porcentaje">0%</span>
                        <span class="progress-lbl">LOGRADO</span>
                    </div>
                </div>
                <div style="flex: 1;">
                    <h4 style="font-size: 13px; font-weight: 800; color: var(--text-dark); margin: 0 0 5px 0; display: flex; align-items: center;">
                        <span id="lbl-nombre-meta">Meta de ventas</span>
                        <i class="fas fa-pencil-alt edit-meta-btn" onclick="editarMeta()" title="Editar objetivo"></i>
                    </h4>
                    <div style="font-size: 18px; font-weight: 900; color: #5B4DC8; margin-bottom: 5px;">
                        <span id="lbl-ingresos">S/ 0</span> <span style="font-size: 13px; color: var(--text-muted); font-weight: 700;" id="lbl-meta-total">/ S/ 4,000</span>
                    </div>
                    <p style="font-size: 11px; color: var(--text-muted); margin: 0; line-height: 1.3;" id="lbl-faltante">
                        Calculando progreso...
                    </p>
                </div>
            </div>
        </div>

        <!-- Logros Obtenidos -->
        <div class="card">
            <div class="section-header">
                <h3>Logros obtenidos</h3>
                <a href="#">Ver 5 más</a>
            </div>
            <div class="achievements-grid">
                <div class="achievement-card">
                    <div class="ach-icon" style="background: #EBF5FF; color: #3B82F6;"><i class="fas fa-star"></i></div>
                    <span class="ach-title">Primer curso completado</span>
                </div>
                <div class="achievement-card">
                    <div class="ach-icon" style="background: #F3E8FF; color: #9333EA;"><i class="fas fa-medal"></i></div>
                    <span class="ach-title">Experto en finanzas</span>
                </div>
                <div class="achievement-card">
                    <div class="ach-icon" style="background: #FEF3C7; color: #D97706;"><i class="fas fa-award"></i></div>
                    <span class="ach-title">Emprendedor Yaku</span>
                </div>
            </div>
        </div>

        <!-- Evolución -->
        <div class="card">
            <div class="section-header" style="margin-bottom: 5px;">
                <div style="line-height: 1.2;">
                    <h3>Tu evolución</h3>
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 700;">Constancia de estudio y metas</span>
                </div>
                <div class="status-badge" style="background: #DDF3D6; color: #10B981;"><i class="fas fa-arrow-trend-up"></i> +28%</div>
            </div>
            
            <div class="chart-container">
                <div class="chart-bar-group">
                    <div class="bar-bg" style="height: 100%;"><div class="bar-fill" style="height: 30%;"></div></div>
                    <span class="bar-label">Sem 1</span>
                </div>
                <div class="chart-bar-group">
                    <div class="bar-bg" style="height: 100%;"><div class="bar-fill" style="height: 45%;"></div></div>
                    <span class="bar-label">Sem 2</span>
                </div>
                <div class="chart-bar-group">
                    <div class="bar-bg" style="height: 100%;"><div class="bar-fill" style="height: 60%;"></div></div>
                    <span class="bar-label">Sem 3</span>
                </div>
                <div class="chart-bar-group">
                    <div class="bar-bg" style="height: 100%;"><div class="bar-fill active" id="bar-sem4" style="height: 0%;">
                        <span class="bar-val" id="lbl-bar-pct">0%</span>
                    </div></div>
                    <span class="bar-label" style="color: #5B4DC8; font-weight: 800;">Sem 4</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Menú Inferior -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-btn"><i class="fas fa-home"></i><span>Inicio</span></a>
        <a href="misfinanzas.html" class="nav-btn"><i class="fas fa-chart-bar"></i><span>Reportes</span></a>
        <a href="configuracion.html" class="nav-btn"><i class="fas fa-user"></i><span>Perfil</span></a>
    </div>
</div>

<script>
    let metaMensual = parseFloat(localStorage.getItem('yaku_meta')) || 4000;
    
    function inicializarFecha() {
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        const fecha = new Date();
        document.getElementById('lbl-mes-meta').innerText = `Meta ${meses[fecha.getMonth()]} ${fecha.getFullYear()}`;
    }

    function calcularProgreso() {
        const transacciones = JSON.parse(localStorage.getItem('yaku_data')) || [];
        let ingresosTotales = 0;

        transacciones.forEach(t => {
            if (t.tipo === 'venta' || t.tipo === 'ingreso') {
                ingresosTotales += parseFloat(t.monto);
            }
        });

        let porcentaje = Math.round((ingresosTotales / metaMensual) * 100);
        if (porcentaje > 100) porcentaje = 100;
        
        let faltante = metaMensual - ingresosTotales;
        if (faltante < 0) faltante = 0;

        const nombreMeta = localStorage.getItem('yaku_meta_nombre') || 'Meta de ventas';
        const metaFormateada = metaMensual.toLocaleString('es-PE');
        const ingresosFormateados = ingresosTotales.toLocaleString('es-PE');
        const faltanteFormateado = faltante.toLocaleString('es-PE');

        document.getElementById('lbl-nombre-meta').innerText = nombreMeta;
        document.getElementById('lbl-meta-total').innerText = `/ S/ ${metaFormateada}`;
        document.getElementById('lbl-porcentaje').innerText = `${porcentaje}%`;
        document.getElementById('lbl-ingresos').innerText = `S/ ${ingresosFormateados}`;
        document.getElementById('donut-meta').style.background = `conic-gradient(#5B4DC8 ${porcentaje}%, #F3F4F6 ${porcentaje}%)`;

        if (faltante === 0) {
            document.getElementById('lbl-faltante').innerHTML = `<span style="color:#10B981; font-weight:800;">¡Felicidades! Has superado tu objetivo.</span>`;
        } else {
            document.getElementById('lbl-faltante').innerHTML = `Faltan <span style="font-weight:800; color:#10B981;">S/ ${faltanteFormateado}</span> para tu objetivo.`;
        }

        document.getElementById('bar-sem4').style.height = `${porcentaje}%`;
        document.getElementById('lbl-bar-pct').innerText = `${porcentaje}%`;
    }

    function editarMeta() {
        const nombreActual = localStorage.getItem('yaku_meta_nombre') || 'Meta de ventas';
        const nuevoNombre = prompt("¿Cuál es el nombre de tu objetivo?", nombreActual);
        
        if (nuevoNombre !== null && nuevoNombre.trim() !== "") {
            const nuevaMetaStr = prompt(`Ingresa el monto a alcanzar en soles para "${nuevoNombre.trim()}":`, metaMensual);
            
            if (nuevaMetaStr !== null) {
                const nuevaMeta = parseFloat(nuevaMetaStr.replace(/[^0-9.-]+/g,""));
                if (!isNaN(nuevaMeta) && nuevaMeta > 0) {
                    localStorage.setItem('yaku_meta_nombre', nuevoNombre.trim());
                    localStorage.setItem('yaku_meta', nuevaMeta);
                    metaMensual = nuevaMeta;
                    calcularProgreso();
                } else {
                    alert("Por favor, ingresa un monto válido mayor a cero.");
                }
            }
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        inicializarFecha();
        calcularProgreso();
    });
</script>
</body>
</html>
